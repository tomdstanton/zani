[project]
name = "zani"
description = "A zero-dependency, ultra-fast Average Nucleotide Identity (ANI) estimator using Zstandard compression distance."
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
readme = "README.md"
license = {file = "LICENSE"}
dynamic = ["version"]
keywords = ["python", "bioinformatics", "ani", "pathogens", "genomics"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://tomdstanton.github.io/zani/"
Repository = "https://github.com/tomdstanton/zani"
Documentation = "https://tomdstanton.github.io/zani/"


[project.scripts]
zani = "zani.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zani"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zani/_version.py"
